AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS SAM Template for your FastAPI application

Parameters:
  HttpApiName:
    Type: String
    Default: sports-models-http-api
  ApiFunctionName:
    Type: String
    Default: sports-models-api
  TrainingFunctionName:
    Type: String
    Default: sports-models-training
  CoordinatorFunctionName:
    Type: String
    Default: sports-models-schedule-coordinator
  TrainingScheduleGroupName:
    Type: String
    Default: sports-models-training-updates
  Localhost:
    Type: String
    Default: "False"
  EnvironmentName:
    Type: String
    Default: "PROD"
  AdminApiKey:
    Type: String
    NoEcho: true
  FrontEndApiKey:
    Type: String
    NoEcho: true
  ReadApiKey:
    Type: String
    NoEcho: true
  NbaApiKey:
    Type: String
    NoEcho: true
  AwsApiKey:
    Type: String
    NoEcho: true
  CfbdApiKey:
    Type: String
    NoEcho: true
  SupabaseDbUrl:
    Type: String
    NoEcho: true
  SupabaseSchema:
    Type: String
    Default: sports_models
  NflExpectedPointsVersion:
    Type: String
    Default: "1.0"
  CfbExpectedPointsVersion:
    Type: String
    Default: "1.0"
  SourceGitSha:
    Type: String
    Default: local

Globals:
  Function:
    Architectures:
      - arm64
    Environment:
      Variables:
        LOCALHOST: !Ref Localhost
        ENVIRONMENT: !Ref EnvironmentName
        ADMIN_API_KEY: !Ref AdminApiKey
        FRONT_END_API_KEY: !Ref FrontEndApiKey
        READ_API_KEY: !Ref ReadApiKey
        NBA_API_KEY: !Ref NbaApiKey
        AWS_API_KEY: !Ref AwsApiKey
        SUPABASE_DB_URL: !Ref SupabaseDbUrl
        SUPABASE_SCHEMA: !Ref SupabaseSchema

Resources:
  SportsModelsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Ref HttpApiName

  TrainingScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Ref TrainingScheduleGroupName

  ScheduledUpdateDeliveryDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  TrainingScheduleInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeTrainingAndWriteDlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TrainingLambdaFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ScheduledUpdateDeliveryDlq.Arn

  ApiLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Ref ApiFunctionName
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          CFBD_API_KEY: !Ref CfbdApiKey
          TRAINING_FUNCTION_ARN: !GetAtt TrainingLambdaFunction.Arn
          SCHEDULER_TARGET_ROLE_ARN: !GetAtt TrainingScheduleInvokeRole.Arn
          SCHEDULE_GROUP_NAME: !Ref TrainingScheduleGroupName
          SCHEDULER_DLQ_ARN: !GetAtt ScheduledUpdateDeliveryDlq.Arn
          SOURCE_GIT_SHA: !Ref SourceGitSha
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:GetSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${TrainingScheduleGroupName}/sports-models-*-manual-*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt TrainingScheduleInvokeRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        NflUpdatePicks:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /nfl-update-picks
            Method: POST
        CfbUpdatePicks:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /cfb-update-picks
            Method: POST
        ModelUpdateJobStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /model-update-jobs/{run_key}
            Method: GET
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /
            Method: GET
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /health
            Method: GET
        OpenApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /openapi.json
            Method: GET
        Docs:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /docs
            Method: GET
        Redoc:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /redoc
            Method: GET
        NflPicks:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /nfl-picks
            Method: GET
        NflPickResults:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /nfl-pick-results
            Method: GET
        CfbPicks:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /cfb-picks
            Method: GET
        CfbPickResults:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /cfb-pick-results
            Method: GET
        NbaFirstBasketUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /nba-first-basket-upload
            Method: POST
        NbaFirstBasketPicks:
          Type: HttpApi
          Properties:
            ApiId: !Ref SportsModelsHttpApi
            Path: /nba-first-basket-picks
            Method: GET
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python311-v1

  ScheduleCoordinatorLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Ref CoordinatorFunctionName
      Timeout: 180
      MemorySize: 512
      ReservedConcurrentExecutions: 1
      ImageConfig:
        Command:
          - src.sports.football.schedule_coordinator.handler
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 1800
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure:
            Type: SQS
      Environment:
        Variables:
          CFBD_API_KEY: !Ref CfbdApiKey
          TRAINING_FUNCTION_ARN: !GetAtt TrainingLambdaFunction.Arn
          SCHEDULER_TARGET_ROLE_ARN: !GetAtt TrainingScheduleInvokeRole.Arn
          SCHEDULE_GROUP_NAME: !Ref TrainingScheduleGroupName
          SCHEDULER_DLQ_ARN: !GetAtt ScheduledUpdateDeliveryDlq.Arn
          SOURCE_GIT_SHA: !Ref SourceGitSha
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
                - scheduler:UpdateSchedule
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${TrainingScheduleGroupName}/*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt TrainingScheduleInvokeRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        MorningSchedulePlan:
          Type: ScheduleV2
          Properties:
            Name: sports-models-training-schedule-check
            Description: Plan the daily 5 AM and upcoming NFL/CFB game-window updates
            ScheduleExpression: cron(45 4 * * ? *)
            ScheduleExpressionTimezone: America/New_York
            State: ENABLED
            FlexibleTimeWindow:
              Mode: "OFF"
            Input: '{"job":"coordinate_expected_points_updates"}'
            RetryPolicy:
              MaximumRetryAttempts: 1
              MaximumEventAgeInSeconds: 1800
        NoonSchedulePlan:
          Type: ScheduleV2
          Properties:
            Name: sports-models-training-schedule-check-noon
            Description: Reconcile same-day NFL and CFB kickoff schedule changes
            ScheduleExpression: cron(0 12 * * ? *)
            ScheduleExpressionTimezone: America/New_York
            State: ENABLED
            FlexibleTimeWindow:
              Mode: "OFF"
            Input: '{"job":"coordinate_expected_points_updates"}'
            RetryPolicy:
              MaximumRetryAttempts: 1
              MaximumEventAgeInSeconds: 1800
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python311-v1

  TrainingLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Ref TrainingFunctionName
      Timeout: 900
      MemorySize: 10240
      ReservedConcurrentExecutions: 1
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 3600
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure:
            Type: SQS
      Environment:
        Variables:
          CFBD_API_KEY: !Ref CfbdApiKey
          NFL_EXPECTED_POINTS_VERSION: !Ref NflExpectedPointsVersion
          CFB_EXPECTED_POINTS_VERSION: !Ref CfbExpectedPointsVersion
          SOURCE_GIT_SHA: !Ref SourceGitSha
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: python311-v1

Outputs:
  HttpApiUrl:
    Description: Base URL for the deployed HTTP API
    Value: !GetAtt SportsModelsHttpApi.ApiEndpoint
